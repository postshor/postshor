name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not network"

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m network
        continue-on-error: true  # depends on third-party servers

  dogfood:
    # PostShor must pass its own scan (policy in .postshor.toml).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          fail-on: high

  published-action:
    # The Marketplace action (postshor/postshor-action@v1) must keep working against this repository.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Checks that the released action installs, scans and reports. Policy is enforced by the
      # dogfood job with the current code; the released version may lag behind it.
      - uses: postshor/postshor-action@v1
        id: published
        with:
          path: tests/fixtures/clean_app   # no config file, so only the action's own behaviour is tested
          upload-sarif: "false"
      - name: Check the action produced a score
        env:
          GRADE: ${{ steps.published.outputs.grade }}
          SCORE: ${{ steps.published.outputs.score }}
        run: |
          echo "Released action reported grade $GRADE ($SCORE)"
          [ "$GRADE" = "A" ] && [ "$SCORE" = "100" ]
