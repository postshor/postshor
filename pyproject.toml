[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "postshor"
dynamic = ["version"]
description = "Find every quantum-vulnerable algorithm in your code, dependencies, certificates, configs and servers, and get a migration plan to post-quantum cryptography."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PostShor contributors" }]
keywords = ["post-quantum", "pqc", "cryptography", "cbom", "ml-kem", "ml-dsa", "security", "sast", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "cyclonedx-python-lib[json-validation]>=8"]

[project.scripts]
postshor = "postshor.cli:main"

[project.urls]
Homepage = "https://github.com/postshor/postshor"
Issues = "https://github.com/postshor/postshor/issues"
Changelog = "https://github.com/postshor/postshor/blob/main/CHANGELOG.md"
"QRS specification" = "https://github.com/postshor/postshor/blob/main/docs/spec/qrs-v1.md"

[tool.hatch.version]
path = "src/postshor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/postshor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]  # intentionally vulnerable, non-runnable sample code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are user-facing message strings and inline CSS; splitting them hurts readability
    "S101",    # assert is how pytest works
    "S311",    # random is not used for cryptography
    "S112",    # parsers are tried in turn; a failure just means "not this format"
    "RUF001",  # en dashes and other typography in user-facing text are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
